name: eval
# Retrieval-quality benchmark on the labelled vault, keyword-only and with the local multilingual model.
# Results are posted to issue #3 so they're public and comparable across commits.
on:
  push:
    branches: [main]
    paths: ["src/**", "eval/**"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run eval (keyword only, then local model)
        run: |
          {
            echo "### Eval for ${GITHUB_SHA::7}"
            echo
            node src/cli.js eval --embeddings none
            echo
            GITHIPPO_HOME="$RUNNER_TEMP/gh" node src/cli.js eval --embeddings local
            echo
            echo '<details><summary>misses (local model)</summary>'
            echo
            echo '```json'
            GITHIPPO_HOME="$RUNNER_TEMP/gh" node src/cli.js eval --embeddings local --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(JSON.stringify({misses:r.misses,routeMisses:r.routeMisses,dedupeMisses:r.dedupeMisses},null,1))})'
            echo '```'
            echo '</details>'
            echo
            echo "**Memory:** $(GITHIPPO_HOME="$RUNNER_TEMP/gh" EMBED_IDLE_MS=3000 node --expose-gc eval/memory.js)"
          } > eval.md
          cat eval.md
      - name: Post results to issue #3
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 3 --body-file eval.md
