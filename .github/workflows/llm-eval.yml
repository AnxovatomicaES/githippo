name: llm-eval
# Does memory make Claude's answers better? LongMemEval question answering (no memory / githippo / oracle) and
# the memory-behaviour scenario. Needs the repository secret ANTHROPIC_API_KEY; costs API credits, so manual only.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: LongMemEval questions (evenly spaced)
        default: "50"
permissions:
  contents: read
  issues: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for the API key
        run: test -n "$ANTHROPIC_API_KEY" || { echo "::error::Add the ANTHROPIC_API_KEY repository secret to run this evaluation."; exit 1; }
      - uses: actions/cache@v4
        with:
          path: longmemeval_s_cleaned.json
          key: longmemeval-s-cleaned-98d7416c
      - run: test -s longmemeval_s_cleaned.json || curl -fsSL -o longmemeval_s_cleaned.json "$(node -e 'import("./eval/longmemeval.js").then(m=>console.log(m.DATASET_URL))')"
      - name: Run
        run: |
          {
            echo "### LLM evaluation for ${GITHUB_SHA::7}"; echo
            node eval/qa.js --data longmemeval_s_cleaned.json --sample ${{ inputs.sample }}
            echo; echo "**Memory behaviour (scripted 3-session scenario, then probes in a fresh session)**"; echo; echo '```json'
            node -e 'import("./eval/behavior.js").then(async m=>{const {createLLM}=await import("./src/llm.js");const llm=createLLM(process.env);console.log(JSON.stringify(await m.runBehavior({llm}),null,1))})'
            echo '```'
          } > llm.md
          cat llm.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 3 --body-file llm.md
