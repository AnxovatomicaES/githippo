name: release
# On every version tag: test, build the Claude Desktop extension (.mcpb), attach it to a GitHub release,
# and publish the listing to the official MCP Registry. No stored secrets: the registry login uses
# GitHub's OIDC identity token (id-token: write), the release uses the job's own token.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check every version and pinned tag matches the release tag
        run: node scripts/versions.mjs
      - name: Build Claude Desktop extension
        run: node scripts/build-mcpb.mjs
      - name: Write server.json from the built bundle's hash
        run: node scripts/server-json.mjs
      - name: Install mcp-publisher and validate the listing (before anything is published)
        run: |
          # Pinned release + checksum (from the release's published asset digest): this job holds id-token: write, so it must not
          # run whatever "latest" happens to be. To upgrade: pick a release, copy the linux_amd64 tarball's sha256 digest here.
          MCP_PUBLISHER_VERSION="v1.8.1"
          MCP_PUBLISHER_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version || true
          if ! ./mcp-publisher validate > validate.log 2>&1; then
            cat validate.log
            { echo "### Registry validation failed for $GITHUB_REF_NAME"; echo; echo '```'; cat validate.log; echo '```'; echo; echo '```json'; cat server.json; echo '```'; } > fail.md
            GH_TOKEN="${{ github.token }}" gh issue comment 3 --body-file fail.md
            exit 1
          fi
          cat validate.log
      - name: Create GitHub release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.mcpb dist/*.sha256 \
            --title "githippo $GITHUB_REF_NAME" --generate-notes
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
