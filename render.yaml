services:
  - type: web
    name: githippo
    runtime: node
    plan: starter            # 512 MB RAM. The local embedding model needs ~600 MB while in use, so this plan runs keyword search
                             # (EMBEDDINGS=none, 96% R@5 on LongMemEval). On a 2 GB+ plan set EMBEDDINGS=local.
    buildCommand: npm ci
    startCommand: node src/cli.js http
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GITHUB_TOKEN
        sync: false
      - key: MEMORY_REPO
        sync: false
      - key: MCP_SECRET
        generateValue: true
      - key: PUBLIC_URL          # e.g. https://githippo-xyz.onrender.com (the OAuth issuer)
        sync: false
      - key: USERS_JSON          # optional: team vault users from `githippo users`
        sync: false
      - key: TRUST_PROXY         # Render's proxy appends the real client address to X-Forwarded-For
        value: "1"
      - key: EMBEDDINGS
        value: none              # none | local (needs 2 GB+) | static (English only, ~200 MB) | voyage (API key)
      - key: CACHE_DIR
        value: /tmp/githippo
      - key: VOYAGE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
